name: lao_location_prediction
description: "lao_location_prediction is a robust Dart package designed to provide fast and accurate location-based queries specifically for locations within the Lao People's Democratic Republic. Leveraging a spatial grid, this package enables developers to easily find nearby places, search within geographical boundaries, and look up locations by name, all optimized for the context of Laos."
version: 0.0.4
homepage: https://github.com/SouksavathPMS/lao-location-prediction
repository: https://github.com/SouksavathPMS/lao-location-prediction
issue_tracker: https://github.com/SouksavathPMS/lao-location-prediction/issues
license: MIT


environment:
  sdk: ^3.7.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
    assets:
    - assets/grid_metadata.json
    - assets/default_data.json
    - assets/cells/

example: example/lib/main.dart


  

  
  
  
  
  
  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
